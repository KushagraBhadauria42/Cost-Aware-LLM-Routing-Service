apiVersion: 1

# Auto-provisions the Prometheus datasource on Grafana startup so a fresh `docker compose up`
# needs zero manual click-ops in the Grafana UI. uid is fixed ("prometheus") so the dashboard
# JSON in ../dashboards/llm-router.json can reference it by a stable id.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false
