services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-router-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-llmrouter}
      POSTGRES_USER: ${DB_USERNAME:-llmrouter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-llmrouter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-llmrouter} -d ${DB_NAME:-llmrouter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: llm-router-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: llm-router-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: llm-router-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-router-app
    ports:
      - "8080:8080"
    environment:
      # Service names (postgres/redis), not localhost - the app resolves them over the
      # docker-compose network. Prometheus still reaches this container via
      # host.docker.internal:8080 (see docker/prometheus/prometheus.yml), since the
      # "8080:8080" port mapping above also publishes it on the host.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-llmrouter}
      DB_USERNAME: ${DB_USERNAME:-llmrouter}
      DB_PASSWORD: ${DB_PASSWORD:-llmrouter}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-}
      BENCHMARK_ENABLED: ${BENCHMARK_ENABLED:-false}
      BENCHMARK_USE_REAL_PROVIDERS: ${BENCHMARK_USE_REAL_PROVIDERS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  grafana_data:
